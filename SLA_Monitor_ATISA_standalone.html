const mkId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const getSt=(av,sla)=>{const d=av-sla;return d>=0?{l:'CUMPLIDO',c:'ok'}:d>=-0.5?{l:'EN RIESGO',c:'warning'}:{l:'INCUMPLIDO',c:'critical'};};
function dynC(av,sla){if(av==null)return'#555';const d=av-sla;if(d>=0)return G.gr;if(d>=-0.3)return iC(G.gr,G.ye,Math.abs(d)/0.3);if(d>=-1.5)return iC(G.ye,G.re,Math.min(1,(Math.abs(d)-0.3)/1.2));return G.re;}
function iC(a,b,t){const p1=parseInt(a.slice(1),16),p2=parseInt(b.slice(1),16);const r=Math.round(((p1>>16)&255)+(((p2>>16)&255)-((p1>>16)&255))*t);const g=Math.round(((p1>>8)&255)+(((p2>>8)&255)-((p1>>8)&255))*t);const bl=Math.round((p1&255)+((p2&255)-(p1&255))*t);return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${bl.toString(16).padStart(2,'0')}`;}
const avgM=s=>{const ws=s.weeks.filter(w=>w.avail!=null);return ws.length?ws.reduce((a,w)=>a+w.avail,0)/ws.length:null;};
const minsToHM=m=>{if(!m||m<=0)return'-';const h=Math.floor(m/60),mn=m%60;return h>0?(mn>0?`${h}h ${mn}m`:`${h}h`):`${mn}m`;};
const minsToHMraw=minsToHM;
const cmpSortK=keys=>keys.slice().sort((a,b)=>{const ap=a.split('-').map(Number),bp=b.split('-').map(Number);return ap[0]!==bp[0]?ap[0]-bp[0]:ap[1]-bp[1];});
const cmpML=k=>{const p=k.split('-');return MSHORT[parseInt(p[1])]+' '+p[0];};
const getDelta=(s,allData,selYear,selMonth)=>{const prevKey=selMonth===0?(selYear-1)+'-11':selYear+'-'+(selMonth-1);const prev=(allData[prevKey]||[]).find(x=>x.name===s.name);if(!prev)return null;const ca=avgM(s),pa=avgM(prev);return(ca==null||pa==null)?null:ca-pa;};

// ── Tiny helpers ─────────────────────────────────────────────────────────────
function Toast({msg,onDone}){useEffect(()=>{const t=setTimeout(onDone,2500);return()=>clearTimeout(t);},[]);return <div className="toast-bar">{msg}</div>;}
function ConfirmModal({msg,onYes,onNo}){return(<div className="overlay" style={{zIndex:500}}><div className="confirm-box"><h3>⚠ Confirmar</h3><p>{msg}</p><div style={{display:'flex',gap:10,justifyContent:'center'}}><button className="btn b-re" onClick={onYes}>Sí, confirmar</button><button className="btn b-gh" onClick={onNo}>Cancelar</button></div></div></div>);}
function ChartCanvas({id,height=210,builder,deps}){const ref=useRef(null),ch=useRef(null);useEffect(()=>{if(!deps||!deps.some(d=>d!=null))return;loadChart().then(C=>{if(!ref.current)return;if(ch.current)ch.current.destroy();ch.current=builder(C,ref.current);}).catch(()=>{});return()=>{if(ch.current){ch.current.destroy();ch.current=null;}};},[...(deps||[])]);return<div className="cht-wrap" style={{height}}><canvas ref={ref} style={{width:'100%',height:'100%'}}/></div>;}

// ── SvcModal ─────────────────────────────────────────────────────────────────

  const sw=(i,k,v)=>{const nw=[...f.weeks];nw[i]={...nw[i],[k]:v};setF({...f,weeks:nw});};
  return(<div className="overlay"><div className="mbox">
    <div className="mhdr"><h2>{svc?`✏ Editar: ${svc.name}`:'+ Nuevo Servicio'}</h2><button className="xbtn" onClick={onClose}>✕</button></div>
    <div className="msec">Información</div>
    <div className="fgrid">

      <div className="fgrp"><label>Descripción</label><select value={f.desc} onChange={e=>setF({...f,desc:e.target.value})}><option value="">— Seleccionar —</option>{descs.map(d=><option key={d} value={d}>{d}</option>)}</select></div>
      <div className="fgrp"><label>Categoría</label><select value={f.cat} onChange={e=>setF({...f,cat:e.target.value})}>{cats.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
      <div className="fgrp"><label>SLA (%)</label><input type="number" step="0.01" value={f.sla} onChange={e=>setF({...f,sla:parseFloat(e.target.value)||99.8})}/></div>
    </div>
    <div className="msec">Datos por Semana</div>
    <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',minWidth:560,marginBottom:12}}>
      <thead><tr><th style={{fontFamily:'JetBrains Mono',fontSize:'.5rem',color:'#4a5280',textTransform:'uppercase',padding:'6px 8px',background:'#0d1020',textAlign:'left'}}>Métrica</th>
        {(wd||DEFAULT_WD).map((w,i)=><th key={i} style={{color:'#00e5ff',fontFamily:'JetBrains Mono',fontSize:'.5rem',textTransform:'uppercase',padding:'6px 8px',background:'#0d1020',textAlign:'center'}}>S{i+1}{w.from&&w.to?<><br/><span style={{fontSize:'.44rem',opacity:.7}}>{w.from.slice(5)}→{w.to.slice(5)}</span></>:''}</th>)}
      </tr></thead>
      <tbody>{[{k:'avail',l:'Disponibilidad (%)'},{k:'tickets',l:'Tickets'},{k:'time',l:'T.Res (min)'},{k:'dt',l:'Downtime (min)'}].map(({k,l})=>(
        <tr key={k}><td style={{fontSize:'.62rem',color:'#4a5280',padding:'5px 8px'}}>{l}</td>
          {f.weeks.map((w,i)=><td key={i}><input className="wi" type="number" placeholder="—" value={w[k]??''} onChange={e=>sw(i,k,e.target.value===''?null:parseFloat(e.target.value))}/></td>)}

    <div className="fgrid" style={{marginBottom:14}}>

      <div className="fgrp"><label>Comentarios</label><textarea rows="2" value={f.comments} onChange={e=>setF({...f,comments:e.target.value})} placeholder="Notas…"/></div>
    </div>
    <div style={{display:'flex',gap:8}}><button className="btn b-cy" onClick={()=>onSave(f)}>✓ Guardar</button><button className="btn b-gh" onClick={onClose}>Cancelar</button></div>

// ── ImportModal ───────────────────────────────────────────────────────────────
function ImportModal({onClose,onImport}){
  const [rows,setRows]=useState([]);const [drag,setDrag]=useState(false);const [mode,setMode]=useState('merge');const fRef=useRef();
  const proc=file=>{loadXLSX().then(X=>{const r=new FileReader();r.onload=e=>{try{const wb=X.read(e.target.result,{type:'binary'});const ws=wb.Sheets[wb.SheetNames[0]];const raw=X.utils.sheet_to_json(ws,{defval:''});if(!raw.length)return;const fc=(ns,row)=>{for(const n of ns)for(const k of Object.keys(row))if(k.toLowerCase().includes(n.toLowerCase()))return k;return null;};const mapped=raw.map(row=>{const nk=fc(['nombre','name','servicio'],row);if(!nk||!row[nk])return null;const ck=fc(['cat','categoria'],row);const sk=fc(['sla','obj'],row);const dk=fc(['desc','descripcion'],row);const weeks=Array(5).fill(null).map((_,wi)=>{const wp=`S${wi+1}`;const ak=Object.keys(row).find(k=>k.toUpperCase().includes(wp)&&k.toLowerCase().includes('disp'));const tk=Object.keys(row).find(k=>k.toUpperCase().includes(wp)&&k.toLowerCase().includes('tkt'));const tmk=Object.keys(row).find(k=>k.toUpperCase().includes(wp)&&k.toLowerCase().includes('res'));const dtk=Object.keys(row).find(k=>k.toUpperCase().includes(wp)&&k.toLowerCase().includes('dt'));return{avail:ak&&row[ak]!==''?parseFloat(row[ak]):null,tickets:tk?parseInt(row[tk])||0:0,time:tmk?parseInt(row[tmk])||0:0,dt:dtk?parseInt(row[dtk])||0:0};});return{name:String(row[nk]).trim(),cat:ck?String(row[ck]).trim():'Sin categoría',sla:sk?parseFloat(row[sk])||99.8:99.8,desc:dk?String(row[dk]).trim():'',remediation:'',comments:'',weeks};}).filter(Boolean);setRows(mapped);}catch(ex){}};r.readAsBinaryString(file);});};
  return(<div className="overlay"><div className="mbox" style={{maxWidth:600}}>
    <div className="mhdr"><h2>⬇ Importar Excel / CSV</h2><button className="xbtn" onClick={onClose}>✕</button></div>
    <div className={`import-area${drag?' drag':''}`} onDrop={e=>{e.preventDefault();setDrag(false);if(e.dataTransfer.files[0])proc(e.dataTransfer.files[0]);}} onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onClick={()=>fRef.current.click()}>
      <div style={{fontSize:'2rem',marginBottom:6,opacity:.4}}>📁</div>
      <div style={{fontFamily:'JetBrains Mono',fontSize:'.66rem',color:'#4a5280'}}>Arrastra .xlsx / .csv aquí o haz clic para seleccionar</div>
      <input ref={fRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>{if(e.target.files[0])proc(e.target.files[0]);}}/>
    </div>
    <div style={{display:'flex',gap:16,marginBottom:12}}>
      <label style={{fontFamily:'JetBrains Mono',fontSize:'.62rem',color:'#e8eaf6',cursor:'pointer'}}><input type="radio" checked={mode==='merge'} onChange={()=>setMode('merge')} style={{marginRight:6}}/>Fusionar</label>
      <label style={{fontFamily:'JetBrains Mono',fontSize:'.62rem',color:'#e8eaf6',cursor:'pointer'}}><input type="radio" checked={mode==='replace'} onChange={()=>setMode('replace')} style={{marginRight:6}}/>Reemplazar</label>
    </div>
    {rows.length>0&&<div style={{fontFamily:'JetBrains Mono',fontSize:'.6rem',color:'#00e676',marginBottom:10}}>✓ {rows.length} servicios listos para importar</div>}
    <div style={{display:'flex',gap:8}}><button className="btn b-cy" disabled={!rows.length} style={{opacity:rows.length?1:.5}} onClick={()=>onImport(rows,mode)}>⬆ Importar{rows.length?` (${rows.length})`:''}</button><button className="btn b-gh" onClick={onClose}>Cancelar</button></div>
  </div></div>);
}

// ── MonitorTable ──────────────────────────────────────────────────────────────
function MonitorTable({filt,tab,wd,allData,selYear,selMonth,onEdit,onDelete,onSort}){
  const [exp,setExp]=useState({});
  const tA=s=>{if(tab===5)return avgM(s);const v=s.weeks[tab]?.avail;return v==null?null:v;};
  const tTk=s=>tab===5?s.weeks.reduce((a,w)=>a+(w.tickets||0),0):(s.weeks[tab]?.tickets||0);
  const tTm=s=>{if(tab===5){const ws=s.weeks.filter(w=>w.time>0);return ws.length?Math.round(ws.reduce((a,w)=>a+w.time,0)/ws.length):0;}return s.weeks[tab]?.time||0;};
  const tDT=s=>tab===5?s.weeks.reduce((a,w)=>a+(w.dt||0),0):(s.weeks[tab]?.dt||0);
  const heads=[{t:'#'},{t:'Servicio',s:'name'},{t:'Desc.'},{t:'Cat.',s:'cat'},{t:'SLA',s:'sla'},{t:'Disponibilidad',s:'avail'},{t:'Estado',s:'status'},{t:'Tickets',s:'tickets'},{t:'T.Prom'},{t:'Downtime'},{t:'Remediación'},{t:'Comentarios'},{t:'Acciones'}];
  return(<div className="tbl-wrap"><table>
    <thead><tr>{heads.map((h,i)=><th key={i} className={h.s?'sortable':''} onClick={h.s?()=>onSort(h.s):undefined}>{h.t}</th>)}</tr></thead>
    <tbody>{filt.map((s,i)=>{
      const av=tA(s),st=av!=null?getSt(av,s.sla):null,col=dynC(av,s.sla),tm=tTm(s),dtv=tDT(s),isE=!!exp[s.id];
      const delta=getDelta(s,allData,selYear,selMonth);
      return(<>
        <tr key={s.id} onClick={()=>setExp(e=>({...e,[s.id]:!e[s.id]}))}>
          <td style={{color:'#4a5280'}}>{i+1}</td>
          <td><div className="svcname">{s.name}</div>{delta!=null&&<div style={{fontFamily:'JetBrains Mono',fontSize:'.52rem',color:delta>=0?'#00e676':'#ff1744',marginTop:2}}>{delta>=0?'▲':'▼'}{Math.abs(delta).toFixed(2)}%</div>}</td>
          <td>{s.desc?<span className="bd2">{s.desc}</span>:<span className="nd">-</span>}</td>
          <td><span className="bc">{s.cat}</span></td>
          <td style={{color:'#4a5280'}}>{s.sla}%</td>
          <td>{av!=null?<><span style={{color:col,fontWeight:700,textShadow:`0 0 8px ${col}55`}}>{av.toFixed(2)}%</span><div className="abar"><div className="afill" style={{width:`${Math.min(100,av).toFixed(1)}%`,background:col}}/></div></>:<span className="nd">-</span>}</td>
          <td>{st?<span className={`bs s-${st.c}`}><span className="dott"/>{st.l}</span>:<span className="nd">-</span>}</td>
          <td style={{fontWeight:700,color:'#00e5ff'}}>{tTk(s)}</td>
          <td style={{color:'#ff9800'}}>{tm>0?`${Math.floor(tm/60)}h ${tm%60}m`:'-'}</td>
          <td style={{color:dtv>0?'#ff1744':'#4a5280',fontWeight:dtv>0?700:400}}>{dtv>0?minsToHM(dtv):'-'}</td>
          <td>{s.remediation?<div className="rem-box" title={s.remediation}>{s.remediation}</div>:<span className="nd">-</span>}</td>
          <td>{s.comments?<div className="com-box" title={s.comments}>{s.comments}</div>:<span className="nd">-</span>}</td>
          <td onClick={e=>e.stopPropagation()} style={{whiteSpace:'nowrap'}}>
            <button className="btn-e" onClick={e=>{e.stopPropagation();onEdit(s);}}>✏ Editar</button>{' '}
            <button className="btn-d" onClick={e=>{e.stopPropagation();onDelete(s);}}>🗑</button>
          </td>
        </tr>
        {isE&&(<tr key={`x${s.id}`}><td colSpan={13} style={{padding:'0 9px 10px'}}>
          <div className="exp-inner">
            <div style={{fontSize:'.52rem',color:'#4a5280',fontFamily:'JetBrains Mono',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:8}}>Detalle Semanas — {s.name}</div>
            <div style={{overflowX:'auto'}}><table className="exp-tbl"><thead><tr>
              <th>Métrica</th>
              {(wd||DEFAULT_WD).map((w,wi)=><th key={wi} className="wkh">S{wi+1}{w.from&&w.to?<><br/><span style={{fontSize:'.44rem',opacity:.7}}>{w.from.slice(5)}→{w.to.slice(5)}</span></>:''}</th>)}
              <th style={{color:'#00e676'}}>Total/Prom</th>
            </tr></thead>
            <tbody>{[{k:'avail',l:'Disp(%)'},{k:'tickets',l:'Tickets'},{k:'time',l:'T.Res(min)'},{k:'dt',l:'DT'}].map(({k,l})=>{
              const tot=k==='tickets'?s.weeks.reduce((a,w)=>a+(w.tickets||0),0):k==='dt'?minsToHMraw(s.weeks.reduce((a,w)=>a+(w.dt||0),0)):k==='avail'?avgM(s)!=null?avgM(s).toFixed(2)+'%':'-':(()=>{const ws2=s.weeks.filter(w=>w.time>0);return ws2.length?Math.round(ws2.reduce((a,w)=>a+w.time,0)/ws2.length):'-';})();
              return(<tr key={k}><td style={{color:'#4a5280',fontSize:'.62rem'}}>{l}</td>
                {s.weeks.map((w,wi)=>{const val=w[k];let c='#e8eaf6';if(k==='avail'&&val!=null)c={ok:'#00e676',warning:'#ffea00',critical:'#ff1744'}[getSt(parseFloat(val),s.sla).c];const d=k==='avail'&&val!=null?val.toFixed(1)+'%':k==='dt'&&val>0?minsToHM(val):(val||'-');return<td key={wi} style={{color:c,fontWeight:k==='avail'?700:400}}>{d}</td>;})}
                <td style={{color:'#00e676',fontWeight:700}}>{tot}</td>
              </tr>);})}
            </tbody></table></div>
            {s.remediation&&<div style={{marginTop:8,fontSize:'.6rem',color:'#ffb74d'}}><strong>Remediación:</strong> {s.remediation}</div>}
            {s.comments&&<div style={{marginTop:4,fontSize:'.6rem',color:'#4a5280'}}><strong>Comentarios:</strong> {s.comments}</div>}
          </div>
        </td></tr>)}
      </>);})}
    </tbody>
  </table></div>);
}

// ── ChartsSection ─────────────────────────────────────────────────────────────
function ChartsSection({filt,tab,allSvcs}){
  const tA=s=>{if(tab===5)return avgM(s);const v=s.weeks[tab]?.avail;return v==null?null:v;};
  const tTk=s=>tab===5?s.weeks.reduce((a,w)=>a+(w.tickets||0),0):(s.weeks[tab]?.tickets||0);
  const tTm=s=>{if(tab===5){const ws=s.weeks.filter(w=>w.time>0);return ws.length?Math.round(ws.reduce((a,w)=>a+w.time,0)/ws.length):0;}return s.weeks[tab]?.time||0;};
  const tDT=s=>tab===5?s.weeks.reduce((a,w)=>a+(w.dt||0),0):(s.weeks[tab]?.dt||0);
  const ax={color:'#ffea00',font:{family:"'JetBrains Mono',monospace",size:9}};
  const gc='rgba(255,255,255,.04)';
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#ffea00',font:{family:"'JetBrains Mono',monospace",size:9}}}}};
  const wAv=filt.filter(s=>tA(s)!=null).slice(0,14);
  const ok=filt.filter(s=>tA(s)!=null&&getSt(tA(s),s.sla).c==='ok').length;
  const warn=filt.filter(s=>tA(s)!=null&&getSt(tA(s),s.sla).c==='warning').length;
  const crit=filt.filter(s=>tA(s)!=null&&getSt(tA(s),s.sla).c==='critical').length;
  const cats=[...new Set(allSvcs.map(s=>s.cat))];
  const top5=filt.filter(s=>tDT(s)>0).sort((a,b)=>tDT(b)-tDT(a)).slice(0,5);
  const mx=top5[0]?tDT(top5[0]):1;
  const t5c=['#ff1744','#ff5252','#ff7043','#ff9800','#ffb300'];
  const dep=[filt.length,tab];
  return(<>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))',gap:16,marginTop:8}}>
      <div style={{background:'#0e1120',border:'1px solid #1a2035',padding:14}}><div className="card-lbl" style={{marginBottom:8}}>Disponibilidad vs SLA</div>
        <ChartCanvas id="cAv" height={210} deps={dep} builder={(C,cv)=>new C(cv,{type:'bar',data:{labels:wAv.map(s=>s.name.slice(0,10)),datasets:[{label:'Disponibilidad',data:wAv.map(s=>+((tA(s)||0).toFixed(2))),backgroundColor:wAv.map(s=>dynC(tA(s),s.sla)+'bb'),borderRadius:3},{label:'SLA Obj.',data:wAv.map(s=>s.sla),backgroundColor:'rgba(0,229,255,.08)',borderColor:'#00e5ff',borderWidth:1,type:'line',pointRadius:0,tension:.3}]},options:{...base,scales:{x:{ticks:{...ax,maxRotation:35,minRotation:35},grid:{color:gc}},y:{ticks:{...ax,callback:v=>v+'%'},grid:{color:gc},min:Math.max(0,Math.min(...wAv.map(s=>tA(s)||100))-3)}}}})}/>
      </div>
      <div style={{background:'#0e1120',border:'1px solid #1a2035',padding:14}}><div className="card-lbl" style={{marginBottom:8}}>Estado de Cumplimiento</div>
        <ChartCanvas id="cPi" height={210} deps={dep} builder={(C,cv)=>{const pd=[ok,warn,crit].filter(v=>v>0);const pl=['Cumplido','En Riesgo','Incumplido'].filter((_,i)=>[ok,warn,crit][i]>0);const pc=['#00e676','#ffea00','#ff1744'].filter((_,i)=>[ok,warn,crit][i]>0);return new C(cv,{type:'doughnut',data:{labels:pl,datasets:[{data:pd,backgroundColor:pc,borderWidth:2,borderColor:'#0e1120'}]},options:{...base,cutout:'55%',plugins:{legend:{position:'bottom',labels:{color:'#ffea00',font:{family:"'JetBrains Mono',monospace",size:9},padding:10}}}}});}}/>
      </div>
      <div style={{background:'#0e1120',border:'1px solid #1a2035',padding:14}}><div className="card-lbl" style={{marginBottom:8}}>Tickets por Servicio</div>
        <ChartCanvas id="cTk" height={210} deps={dep} builder={(C,cv)=>{const ts=filt.filter(s=>tTk(s)>0).slice(0,12);return new C(cv,{type:'bar',data:{labels:ts.map(s=>s.name.slice(0,10)),datasets:[{label:'Tickets',data:ts.map(s=>tTk(s)),backgroundColor:'rgba(124,58,237,.75)',borderRadius:3}]},options:{...base,scales:{x:{ticks:{...ax,maxRotation:35,minRotation:35},grid:{color:gc}},y:{ticks:ax,grid:{color:gc}}}}});}}/>
      </div>

// ── InsightsSection ───────────────────────────────────────────────────────────
function InsightsSection({filt,tab}){
  const tA=s=>{if(tab===5)return avgM(s);const v=s.weeks[tab]?.avail;return v==null?null:v;};
  const tTk=s=>tab===5?s.weeks.reduce((a,w)=>a+(w.tickets||0),0):(s.weeks[tab]?.tickets||0);
  const tDT=s=>tab===5?s.weeks.reduce((a,w)=>a+(w.dt||0),0):(s.weeks[tab]?.dt||0);
  const wAv=filt.filter(s=>tA(s)!=null);
  const ok=wAv.filter(s=>getSt(tA(s),s.sla).c==='ok').length;
  const warn=wAv.filter(s=>getSt(tA(s),s.sla).c==='warning').length;
  const crit=wAv.filter(s=>getSt(tA(s),s.sla).c==='critical').length;
  const pct=wAv.length?Math.round(ok/wAv.length*100):0;
  const ins=[];
  if(wAv.length){const w=wAv.reduce((a,b)=>tA(a)<tA(b)?a:b);const st=getSt(tA(w),w.sla);const c=st.c==='critical'?'#ff1744':'#ffea00';ins.push({bg:st.c==='critical'?'#ff174415':'#ffea0010',bc:st.c==='critical'?'#ff174455':'#ffea0055',icon:st.c==='critical'?'🚨':'⚠️',lbl:'Servicio crítico',title:w.name,val:`${tA(w).toFixed(2)}% (SLA: ${w.sla}%)`,col:c});}
  const cats=[...new Set(filt.map(s=>s.cat))];const catCr=cats.map(c=>({cat:c,cr:filt.filter(s=>s.cat===c&&tA(s)!=null&&getSt(tA(s),s.sla).c==='critical').length})).sort((a,b)=>b.cr-a.cr);
  if(catCr[0]&&catCr[0].cr>0)ins.push({bg:'#ff174415',bc:'#ff174455',icon:'📁',lbl:'Cat. más incumplidos',title:catCr[0].cat,val:`${catCr[0].cr} incumplido(s)`,col:'#ff1744'});
  const dtS=filt.filter(s=>tDT(s)>0).sort((a,b)=>tDT(b)-tDT(a));if(dtS[0])ins.push({bg:'#ffea0010',bc:'#ffea0055',icon:'⏱',lbl:'Mayor downtime',title:dtS[0].name,val:minsToHMraw(tDT(dtS[0])),col:'#ffea00'});
  ins.push({bg:pct>=90?'#00e67610':'#ff174415',bc:pct>=90?'#00e67655':'#ff174455',icon:pct>=90?'✅':'📊',lbl:'Cumplimiento general',title:`${pct}% cumplen SLA`,val:`${ok} ok · ${warn} riesgo · ${crit} incumplidos`,col:pct>=90?'#00e676':pct>=70?'#ffea00':'#ff1744'});
  const ttk=filt.reduce((a,s)=>a+tTk(s),0);if(ttk>0)ins.push({bg:'#7c3aed15',bc:'#7c3aed55',icon:'🎫',lbl:'Total tickets',title:`${ttk} incidentes`,val:`${filt.length?+(ttk/filt.length).toFixed(1):0} por servicio`,col:'#a78bfa'});
  if(!ins.length)return null;
  return(<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:12,marginBottom:20}}>
    {ins.map((x,i)=><div key={i} style={{background:x.bg,border:`1px solid ${x.bc}`,padding:'12px 14px',borderLeft:`3px solid ${x.col}`}}>
      <div style={{fontSize:'.56rem',fontFamily:'JetBrains Mono',color:'#4a5280',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>{x.icon} {x.lbl}</div>
      <div style={{fontWeight:700,fontSize:'.82rem',marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={x.title}>{x.title}</div>
      <div style={{fontFamily:'JetBrains Mono',fontSize:'.62rem',color:x.col}}>{x.val}</div>
    </div>)}
  </div>);
}

// ── SemaforoPage ──────────────────────────────────────────────────────────────

  let list=svcs.filter(s=>cf==='all'||s.cat===cf);

  const warn=list.filter(s=>avgM(s)!=null&&getSt(avgM(s),s.sla).c==='warning').length;

  list.sort((a,b)=>{const o={critical:0,warning:1,ok:2};const sa=avgM(a)!=null?getSt(avgM(a),a.sla).c:'z';const sb=avgM(b)!=null?getSt(avgM(b),b.sla).c:'z';return(o[sa]??3)-(o[sb]??3);});
  const sel={background:'#0e1120',border:'1px solid #1a2035',color:'#e8eaf6',fontFamily:'JetBrains Mono',fontSize:'.7rem',padding:'6px 10px',outline:'none'};

      {list.map(s=>{const av=avgM(s);const stk=av!=null?getSt(av,s.sla).c:'nodata';const col=SC2[stk];
        return(<div key={s.id} className={`sema-card ${stk}`}>
          <div style={{fontSize:'2.2rem',marginBottom:6}}>{icons[stk]}</div>
          <div style={{fontFamily:'JetBrains Mono',fontSize:'.52rem',color:'#4a5280',textTransform:'uppercase',marginBottom:4}}>{s.cat}</div>
          <div style={{fontFamily:'Syne',fontWeight:700,fontSize:'.82rem',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={s.name}>{s.name}</div>

        </div>);})}

// ── ComparativosPage ──────────────────────────────────────────────────────────
function ComparativosPage({allData}){
  const allKeys=cmpSortK(Object.keys(allData).filter(k=>(allData[k]||[]).length>0));
  const [sel,setSel]=useState(allKeys.slice(-6));
  const [view,setView]=useState('overview');
  const [cf,setCf]=useState('all');const [sf,setSf]=useState('all');const [metric,setMetric]=useState('avail');
  const ax={color:'#ffea00',font:{family:"'JetBrains Mono',monospace",size:9}};const gc='rgba(255,255,255,.04)';
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#ffea00',font:{family:"'JetBrains Mono',monospace",size:9}}}}};
  const cAvgM=s=>{const ws=s.weeks.filter(w=>w.avail!=null);return ws.length?ws.reduce((a,w)=>a+w.avail,0)/ws.length:null;};
  const cGetSt=(av,sla)=>{const d=av-sla;return d>=0?'ok':d>=-0.5?'warning':'critical';};
  const cDynC=(av,sla)=>{if(av==null)return'#4a5280';const d=av-sla;if(d>=0)return'#00e676';if(d>=-0.3)return iC('#00e676','#ffea00',Math.abs(d)/0.3);if(d>=-1.5)return iC('#ffea00','#ff1744',Math.min(1,(Math.abs(d)-0.3)/1.2));return'#ff1744';};
  const gf=k=>{let s=(allData[k]||[]);if(cf!=='all')s=s.filter(x=>x.cat===cf);if(sf!=='all')s=s.filter(x=>x.name===sf);return s;};
  const bm=()=>{const m={};sel.forEach(k=>gf(k).forEach(s=>{if(!m[s.name])m[s.name]={cat:s.cat,sla:s.sla,months:{}};const wt=s.weeks.filter(w=>w.time>0);m[s.name].months[k]={avail:cAvgM(s),tickets:s.weeks.reduce((a,w)=>a+(w.tickets||0),0),dt:s.weeks.reduce((a,w)=>a+(w.dt||0),0),time:wt.length?Math.round(wt.reduce((a,w)=>a+w.time,0)/wt.length):0};}));return m;};
  const togM=k=>{if(sel.includes(k)){if(sel.length<=1)return;setSel(sel.filter(x=>x!==k));}else setSel(cmpSortK([...sel,k]));};
  if(allKeys.length===0)return(<div style={{textAlign:'center',padding:'60px 20px'}}><div style={{fontSize:'3rem',marginBottom:16,opacity:.3}}>📊</div><h2 style={{fontSize:'1rem',fontWeight:700,marginBottom:10}}>Sin datos históricos</h2><p style={{fontFamily:'JetBrains Mono',fontSize:'.66rem',color:'#4a5280',lineHeight:1.8}}>Guarda datos de al menos 2 meses para ver comparativos.</p></div>);
  const matrix=bm();const svcNames=Object.keys(matrix).sort();const labels=sel.map(cmpML);
  const aD=sel.map(k=>{const sv=gf(k).filter(s=>cAvgM(s)!=null);return sv.length?parseFloat((sv.reduce((a,s)=>a+cAvgM(s),0)/sv.length).toFixed(2)):null;});
  const tkD=sel.map(k=>gf(k).reduce((a,s)=>a+s.weeks.reduce((b,w)=>b+(w.tickets||0),0),0));
  const dtD=sel.map(k=>parseFloat((gf(k).reduce((a,s)=>a+s.weeks.reduce((b,w)=>b+(w.dt||0),0),0)/60).toFixed(2)));
  const okD=sel.map(k=>gf(k).filter(s=>cAvgM(s)!=null&&cGetSt(cAvgM(s),s.sla)==='ok').length);
  const crD=sel.map(k=>gf(k).filter(s=>cAvgM(s)!=null&&cGetSt(cAvgM(s),s.sla)==='critical').length);
  const allSvcsNames=[...new Set(allKeys.flatMap(k=>(allData[k]||[]).map(s=>s.name)))].sort();

        const items=fn(raw).slice(0,10);const mx2=items[0]?.val||1;const tC=['#00e5ff','#00e676','#a78bfa','#ff9800','#ffea00','#ff1744','#7c3aed','#00b4d8','#06d6a0','#ef476f'];

// ── Export / Print ────────────────────────────────────────────────────────────
function doExportXLS(svcs,month,year){
  if(!svcs.length)return;
  const ml=`${MONTHS[month]} ${year}`;
  const cols=['Servicio','Descripcion','Categoria','SLA Obj(%)','S1-Disp%','S1-Tkt','S1-T.Res','S1-DT','S2-Disp%','S2-Tkt','S2-T.R','S2-DT','S3-Disp%','S3-Tkt','S3-T.R','S3-DT','S4-Disp%','S4-Tkt','S4-T.R','S4-DT','S5-Disp%','S5-Tkt','S5-T.R','S5-DT','Prom.Disp%','TotalTkt','TotalDT','Estado'];
  const rows=svcs.map(s=>{const av=avgM(s),st=av!=null?getSt(av,s.sla).l:'Sin datos';return[s.name,s.desc||'',s.cat,s.sla,...s.weeks.flatMap(w=>[w.avail??'',w.tickets||0,w.time||0,w.dt||0]),av!=null?+av.toFixed(2):'',s.weeks.reduce((a,w)=>a+(w.tickets||0),0),s.weeks.reduce((a,w)=>a+(w.dt||0),0),st];});
  const xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="SLA ${ml}"><Table><Row>${cols.map(c=>`<Cell><Data ss:Type="String">${c}</Data></Cell>`).join('')}</Row>${rows.map(r=>`<Row>${r.map(v=>`<Cell><Data ss:Type="${typeof v==='number'?'Number':'String'}">${v}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet></Workbook>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/vnd.ms-excel'}));a.download=`SLA_${ml.replace(' ','_')}.xls`;a.click();
}
function doPrint(svcs,month,year){
  const ml=`${MONTHS[month]} ${year}`;const gAvg=svcs.filter(s=>avgM(s)!=null).reduce((a,s,_,arr)=>a+avgM(s)/arr.length,0);const totTk=svcs.reduce((a,s)=>a+s.weeks.reduce((b,w)=>b+(w.tickets||0),0),0);const totDT=svcs.reduce((a,s)=>a+s.weeks.reduce((b,w)=>b+(w.dt||0),0),0);const wAv=svcs.filter(s=>avgM(s)!=null);const ok=wAv.filter(s=>getSt(avgM(s),s.sla).c==='ok').length;const pct=wAv.length?Math.round(ok/wAv.length*100):0;const crit=wAv.filter(s=>getSt(avgM(s),s.sla).c==='critical').length;const warn=wAv.filter(s=>getSt(avgM(s),s.sla).c==='warning').length;
  const rows=svcs.map(s=>{const av=avgM(s),st=av!=null?getSt(av,s.sla):null;const bg=st?st.c==='ok'?'#e8f5e9':st.c==='warning'?'#fff8e1':'#ffebee':'#fafafa';const col=st?st.c==='ok'?'#2e7d32':st.c==='warning'?'#e65100':'#c62828':'#666';const tk=s.weeks.reduce((a,w)=>a+(w.tickets||0),0),dt=s.weeks.reduce((a,w)=>a+(w.dt||0),0);return`<tr><td>${s.name}</td><td>${s.cat}</td><td>${s.sla}%</td><td style="color:${col};font-weight:700;background:${bg}">${av!=null?av.toFixed(2)+'%':'—'}</td><td style="background:${bg};color:${col}">${st?st.l:'—'}</td><td>${tk}</td><td>${minsToHMraw(dt)}</td></tr>`;}).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>SLA — ${ml}</title><style>body{font-family:Arial,sans-serif;color:#222;margin:0;padding:20px}h1{font-size:1.3rem;margin-bottom:2px}p{color:#666;font-size:.8rem;margin-bottom:16px}.kg{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}.k{border:1px solid #ddd;padding:10px;text-align:center}.kl{font-size:.6rem;color:#888;text-transform:uppercase;margin-bottom:3px}.kv{font-size:1.3rem;font-weight:700}table{width:100%;border-collapse:collapse;font-size:.76rem}th{background:#1a237e;color:#fff;padding:6px 8px;text-align:left;font-size:.62rem;text-transform:uppercase}td{padding:5px 8px;border-bottom:1px solid #eee}tr:hover{background:#f5f5f5}@media print{@page{margin:15mm}}</style></head><body><h1>ATISA Industrial — Reporte SLA</h1><p>Periodo: ${ml} | Generado: ${new Date().toLocaleString()}</p><div class="kg"><div class="k"><div class="kl">Servicios</div><div class="kv">${svcs.length}</div></div><div class="k"><div class="kl">Disp. Prom.</div><div class="kv">${gAvg?gAvg.toFixed(2)+'%':'--'}</div></div><div class="k"><div class="kl">Cumplimiento</div><div class="kv">${pct}%</div></div><div class="k"><div class="kl">Incumplidos</div><div class="kv" style="color:#c62828">${crit}</div></div><div class="k"><div class="kl">Tickets</div><div class="kv">${totTk}</div></div><div class="k"><div class="kl">Downtime</div><div class="kv">${minsToHMraw(totDT)}</div></div></div><table><thead><tr><th>Servicio</th><th>Categoría</th><th>SLA Obj.</th><th>Disponibilidad</th><th>Estado</th><th>Tickets</th><th>Downtime</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=()=>window.print();<\/script></body></html>`;
  const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();}
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [allData,setAllData]=useState({'2026-3':PRELOAD.map(s=>({...s,weeks:s.weeks.map(w=>({...w}))}))});
  const [weekDates,setWeekDates]=useState({'2026-3':DEFAULT_WD});
  const [cats,setCats]=useState(['Checador','NVR','Red','Servidores']);
  const [descs,setDescs]=useState(['CCTV','Reloj Checador','Servicio de Internet','Servidores']);
  const [selYear,setSelYear]=useState(2026);
  const [selMonth,setSelMonth]=useState(3);
  const [tab,setTab]=useState(5);
  const [page,setPage]=useState('monitor');
  const [toast,setToast]=useState(null);
  const [modal,setModal]=useState(null);
  const [fq,setFq]=useState('');const [fcat,setFcat]=useState('all');const [fst,setFst]=useState('all');
  const [sortCol,setSortCol]=useState('name');const [sortAsc,setSortAsc]=useState(true);
  const [wkOpen,setWkOpen]=useState(false);const [wkDraft,setWkDraft]=useState(null);
  const [shared,setShared]=useState(false);const [showCharts,setShowCharts]=useState(false);

  const curKey=()=>`${selYear}-${selMonth}`;
  const curSvcs=()=>allData[curKey()]||[];
  const curWD=()=>weekDates[curKey()]||DEFAULT_WD;
  const showToast=msg=>setToast(msg);
  const tA=s=>{if(tab===5)return avgM(s);const v=s.weeks[tab]?.avail;return v==null?null:v;};
  const tTk=s=>tab===5?s.weeks.reduce((a,w)=>a+(w.tickets||0),0):(s.weeks[tab]?.tickets||0);

  const lsSave=useCallback((data,wd,c,d)=>{
    const p=JSON.stringify({allData:data,weekDates:wd,cats:c,descs:d,savedAt:new Date().toISOString(),v:'5'});
    try{localStorage.setItem(LS_KEY,p);}catch(e){}
    if(window.storage?.set)window.storage.set(LS_KEY,p,true).then(r=>{if(r)setShared(true);}).catch(()=>{});
  },[]);

  useEffect(()=>{
    const load=cb=>{
      if(window.storage?.get){window.storage.get(LS_KEY,true).then(r=>{if(r?.value){try{const d=JSON.parse(r.value);if(d?.allData){setShared(true);cb(d);return;}}catch(e){}}try{const r2=localStorage.getItem(LS_KEY);if(r2){cb(JSON.parse(r2));return;}}catch(e){}cb(null);}).catch(()=>{try{const r2=localStorage.getItem(LS_KEY);if(r2){cb(JSON.parse(r2));return;}}catch(e){}cb(null);});}
      else{try{const r2=localStorage.getItem(LS_KEY);if(r2){cb(JSON.parse(r2));return;}}catch(e){}cb(null);}
    };
    load(saved=>{if(!saved?.allData)return;const base={'2026-3':PRELOAD.map(s=>({...s,weeks:s.weeks.map(w=>({...w}))}))};const merged={...base};Object.keys(saved.allData).forEach(k=>{if((saved.allData[k]||[]).length>0)merged[k]=saved.allData[k];});setAllData(merged);if(saved.weekDates)setWeekDates(wd=>({...wd,...saved.weekDates}));if(saved.cats?.length)setCats(saved.cats);if(saved.descs?.length)setDescs(saved.descs);});
  },[]);

  useEffect(()=>{
    if(!window.storage?.get)return;let ls='';
    const iv=setInterval(()=>{window.storage.get(LS_KEY,true).then(r=>{if(!r?.value)return;try{const d=JSON.parse(r.value);if(!d?.savedAt||d.savedAt===ls)return;ls=d.savedAt;if(d.allData){setAllData(prev=>{const n={...prev};Object.keys(d.allData).forEach(k=>{if((d.allData[k]||[]).length>0)n[k]=d.allData[k];});return n;});}if(d.cats?.length)setCats(d.cats);if(d.descs?.length)setDescs(d.descs);showToast('🔄 Sincronizado');}catch(e){}}).catch(()=>{});},12000);
    return()=>clearInterval(iv);
  },[]);

  const getFiltered=()=>{
    const q=fq.toLowerCase();let l=[...curSvcs()];
    if(q)l=l.filter(s=>s.name.toLowerCase().includes(q)||(s.desc||'').toLowerCase().includes(q)||s.cat.toLowerCase().includes(q));
    if(fcat!=='all')l=l.filter(s=>s.cat===fcat);
    if(fst!=='all')l=l.filter(s=>{const av=tA(s);return av!=null&&getSt(av,s.sla).c===fst;});
    l.sort((a,b)=>{let va,vb;if(sortCol==='name'){va=a.name.toLowerCase();vb=b.name.toLowerCase();}else if(sortCol==='cat'){va=a.cat.toLowerCase();vb=b.cat.toLowerCase();}else if(sortCol==='avail'){va=tA(a)??-1;vb=tA(b)??-1;}else if(sortCol==='tickets'){va=tTk(a);vb=tTk(b);}else if(sortCol==='sla'){va=a.sla;vb=b.sla;}else if(sortCol==='status'){const o={ok:0,warning:1,critical:2};const sa=tA(a),sb=tA(b);va=sa!=null?o[getSt(sa,a.sla).c]:3;vb=sb!=null?o[getSt(sb,b.sla).c]:3;}else{va=0;vb=0;}if(va<vb)return sortAsc?-1:1;if(va>vb)return sortAsc?1:-1;return 0;});
    return l;
  };
  const doSave=(d,w,c,ds)=>lsSave(d,w,c,ds);
  const handleEdit=s=>setModal({type:'edit',svc:s});
  const handleAdd=()=>setModal({type:'add'});
  const handleSave=form=>{if(!form.name.trim()){showToast('⚠ Nombre requerido');return;}const key=curKey();let nd;if(modal.type==='edit'){nd={...allData,[key]:curSvcs().map(s=>s.id===modal.svc.id?{...s,...form}:s)};showToast('✓ Guardado');}else{nd={...allData,[key]:[...(allData[key]||[]),{id:mkId(),...form}]};showToast('✓ Agregado');}setAllData(nd);doSave(nd,weekDates,cats,descs);setModal(null);};
  const handleDelete=s=>setModal({type:'confirm',msg:`¿Eliminar "${s.name}"?`,onYes:()=>{const key=curKey(),nd={...allData,[key]:curSvcs().filter(x=>x.id!==s.id)};setAllData(nd);doSave(nd,weekDates,cats,descs);showToast('✓ Eliminado');setModal(null);}});
  const handleSort=col=>{if(col===sortCol)setSortAsc(a=>!a);else{setSortCol(col);setSortAsc(true);}};
  const lsClear=()=>setModal({type:'confirm',msg:'¿Borrar TODOS los datos? Se restaurará el PRELOAD de Abril 2026.',onYes:()=>{try{localStorage.removeItem(LS_KEY);}catch(e){}if(window.storage?.delete)window.storage.delete(LS_KEY,true).catch(()=>{});setAllData({'2026-3':PRELOAD.map(s=>({...s,weeks:s.weeks.map(w=>({...w}))}))});setModal(null);showToast('Datos eliminados');}});
  const filt=getFiltered();const wAv=filt.filter(s=>tA(s)!=null);const gAvg=wAv.length?wAv.reduce((a,s)=>a+tA(s),0)/wAv.length:null;const totTk=filt.reduce((a,s)=>a+tTk(s),0);const crit=wAv.filter(s=>getSt(tA(s),s.sla).c==='critical').length;const warn=wAv.filter(s=>getSt(tA(s),s.sla).c==='warning').length;const ok=wAv.filter(s=>getSt(tA(s),s.sla).c==='ok').length;const avgC=gAvg==null?G.ac:gAvg>=99?G.gr:gAvg>=98?G.ye:G.re;const info=()=>{const m=Object.keys(allData).filter(k=>(allData[k]||[]).length>0).length;const sz=Math.round(JSON.stringify(allData).length/1024);return{m,sz};};const inf=info();
  const hdrBtn=(label,color,textColor,action,border)=><button style={{fontFamily:'JetBrains Mono',fontSize:'.58rem',color:textColor,background:color,border:border||'none',padding:'5px 10px',cursor:'pointer',fontWeight:700,letterSpacing:'.04em'}} onClick={action}>{label}</button>;

  return(<div style={{background:G.bg,minHeight:'100vh',color:G.tx,fontFamily:"'Syne',sans-serif"}}>
    <style>{css}</style>
    <header style={{position:'sticky',top:0,zIndex:100,background:'rgba(6,8,15,.97)',borderBottom:`1px solid ${G.bd}`,backdropFilter:'blur(12px)',padding:'12px 20px'}}>
      <div style={{maxWidth:1500,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{background:'linear-gradient(135deg,#00e5ff,#7c3aed)',width:32,height:32,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:'.9rem',color:'#000',flexShrink:0}}>A</div>
          <div style={{width:1,height:26,background:G.bd,margin:'0 6px'}}/>
          <h1 style={{fontSize:'.95rem',fontWeight:800,letterSpacing:'.1em',textTransform:'uppercase',whiteSpace:'nowrap'}}>SLA <span style={{color:G.ac}}>Monitor</span></h1>
          {page!=='monitor'&&<span style={{fontFamily:'JetBrains Mono',fontSize:'.58rem',color:G.mu}}>— {page.toUpperCase()}</span>}
        </div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
          <span className="badge b-ac">{MONTHS[selMonth]} {selYear}</span>
          <span className="badge b-gr"><span className="dot-live"/>LIVE</span>
          <span style={{fontFamily:'JetBrains Mono',fontSize:'.56rem',padding:'3px 9px',border:`1px solid ${shared?G.gr:G.ye}55`,color:shared?G.gr:G.ye,background:(shared?G.gr:G.ye)+'08',cursor:'pointer'}} onClick={lsClear}>{shared?'☁ Compartido':'💾 Local'}{inf.m>0?` · ${inf.m}m · ${inf.sz}KB`:''}</span>
          {page==='monitor'&&<>
            {hdrBtn('+ Servicio',G.ac,'#000',handleAdd)}
            {hdrBtn('⬇ Importar',G.or,'#000',()=>setModal({type:'import'}))}
            {hdrBtn('📥 XLS','#1a2035',G.gr,()=>doExportXLS(curSvcs(),selMonth,selYear),`1px solid ${G.gr}55`)}
            {hdrBtn('⚙ Listas','#1a2035',G.mu,()=>setModal({type:'manage'}),`1px solid ${G.bd}`)}
          </>}
          {page!=='monitor'
            ?hdrBtn('← Monitor',G.ac,'#000',()=>setPage('monitor'))
            :<>{hdrBtn('🟢 Semáforo',G.gr,'#000',()=>setPage('semaforo'))}{hdrBtn('📊 Ejecutivo',G.pu,'#fff',()=>setPage('ejecutivo'))}{hdrBtn('📈 Comparativos','#1a2035','#a78bfa',()=>setPage('comparativo'),`1px solid ${G.pu}55`)}</>}
        </div>
      </div>
    </header>
    <main style={{maxWidth:1500,margin:'0 auto',padding:'20px 20px 80px'}}>
      {page==='monitor'&&(<>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
          <span style={{fontFamily:'JetBrains Mono',fontSize:'.58rem',color:G.mu,textTransform:'uppercase',letterSpacing:'.08em'}}>Año</span>
          <select value={selYear} onChange={e=>{setSelYear(parseInt(e.target.value));setTab(5);}} style={{background:G.sf,border:`1px solid ${G.bd}`,color:G.tx,fontFamily:'JetBrains Mono',fontSize:'.7rem',padding:'6px 10px',outline:'none'}}>
            {[2024,2025,2026,2027].map(y=><option key={y} value={y}>{y}</option>)}
          </select>
          <span style={{fontFamily:'JetBrains Mono',fontSize:'.58rem',color:G.mu,textTransform:'uppercase',letterSpacing:'.08em'}}>Mes</span>
          <select value={selMonth} onChange={e=>{setSelMonth(parseInt(e.target.value));setTab(5);}} style={{background:G.sf,border:`1px solid ${G.bd}`,color:G.tx,fontFamily:'JetBrains Mono',fontSize:'.7rem',padding:'6px 10px',outline:'none'}}>
            {MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}
          </select>
          <span style={{fontFamily:'JetBrains Mono',fontSize:'.64rem',color:G.ac,fontWeight:700}}>{MONTHS[selMonth]} {selYear}</span>
          <span style={{fontFamily:'JetBrains Mono',fontSize:'.58rem',color:G.mu}}>{curSvcs().length} servicios</span>
        </div>
        <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:14}}>
          {[0,1,2,3,4].map(i=>{const w=curWD()[i]||{};const ds=w.from&&w.to?`${w.from.slice(5)}→${w.to.slice(5)}`:'';return<button key={i} className={`tab-btn${tab===i?' active':''}`} onClick={()=>setTab(i)}>S{i+1}{ds&&<span style={{fontSize:'.48rem',display:'block',color:G.mu,marginTop:1}}>{ds}</span>}</button>;})}
          <button className={`tab-btn${tab===5?' active':''}`} onClick={()=>setTab(5)}>◈ MES</button>
        </div>
        <div className="sec">KPIs</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(148px,1fr))',gap:12,marginBottom:16}}>
          {[{l:'Servicios',v:curSvcs().length,c:G.ac,cls:'c-ac',sub:`filtro: ${filt.length}`},{l:'Disp. Promedio',v:gAvg!=null?gAvg.toFixed(2)+'%':'-',c:avgC,cls:'c-gr'},{l:'Críticos',v:crit,c:crit>0?G.re:G.gr,cls:'c-re'},{l:'En Riesgo',v:warn,c:warn>0?G.ye:G.gr,cls:'c-ye'},{l:'Cumplidos',v:ok,c:G.gr,cls:'c-gr'},{l:'Tickets',v:totTk,c:G.pu,cls:'c-pu'}].map(k=><div key={k.l} className={`card ${k.cls}`}><div className="card-lbl">{k.l}</div><div className="card-val" style={{color:k.c}}>{k.v}</div>{k.sub&&<div style={{fontFamily:'JetBrains Mono',fontSize:'.55rem',color:G.mu,marginTop:3}}>{k.sub}</div>}</div>)}
        </div>
        <InsightsSection filt={filt} tab={tab}/>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
          <button className="btn b-cy" onClick={handleAdd}>+ Nuevo Servicio</button>
          <button className="btn b-pu" onClick={()=>{setWkDraft(curWD().map(w=>({...w})));setWkOpen(v=>!v);}}>📅 Config. Semanas</button>
          <button className="btn b-gh" style={{borderColor:showCharts?G.ac:G.bd,color:showCharts?G.ac:G.mu}} onClick={()=>setShowCharts(v=>!v)}>{showCharts?'▲':'▼'} Gráficas</button>
          <button className="btn b-gh" onClick={()=>setModal({type:'manage'})}>⚙ Categorías</button>
          <button className="btn b-gh" onClick={lsClear}>🗑 Limpiar BD</button>
        </div>
        {wkOpen&&wkDraft&&<div style={{background:G.sf,border:`1px solid ${G.bd}`,padding:'14px 16px',marginBottom:14}}>
          <div className="sec" style={{marginBottom:10}}>Fechas de Semanas — <span style={{color:G.ac}}>{MONTHS[selMonth]} {selYear}</span></div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:10}}>
            {wkDraft.map((w,i)=><div key={i} className="wk-cfg-item">
              <div style={{fontFamily:'JetBrains Mono',fontSize:'.62rem',color:G.ac,fontWeight:700}}>Semana {i+1}</div>
              <div><div style={{fontFamily:'JetBrains Mono',fontSize:'.5rem',color:G.mu,textTransform:'uppercase',marginBottom:3}}>Desde</div><input className="wk-date-inp" type="date" value={w.from||''} onChange={e=>{const nd=[...wkDraft];nd[i]={...nd[i],from:e.target.value};setWkDraft(nd);}}/></div>
              <div><div style={{fontFamily:'JetBrains Mono',fontSize:'.5rem',color:G.mu,textTransform:'uppercase',marginBottom:3}}>Hasta</div><input className="wk-date-inp" type="date" value={w.to||''} onChange={e=>{const nd=[...wkDraft];nd[i]={...nd[i],to:e.target.value};setWkDraft(nd);}}/></div>
            </div>)}
          </div>
          <div style={{display:'flex',gap:8,marginTop:12}}>
            <button className="btn b-gn" onClick={()=>{const nw={...weekDates,[curKey()]:wkDraft};setWeekDates(nw);doSave(allData,nw,cats,descs);setWkOpen(false);showToast('✓ Fechas guardadas');}}>✓ Guardar</button>
            <button className="btn b-gh" onClick={()=>setWkOpen(false)}>Cerrar</button>
          </div>
        </div>}
        <div style={{background:G.sf,border:`1px solid ${G.bd}`,padding:'12px 16px',marginBottom:12,display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div className="fg"><label>Buscar</label><input type="text" value={fq} onChange={e=>setFq(e.target.value)} placeholder="Nombre, descripción…"/></div>
          <div className="fg"><label>Categoría</label><select value={fcat} onChange={e=>setFcat(e.target.value)}><option value="all">Todas</option>{cats.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
          <div className="fg"><label>Estado</label><select value={fst} onChange={e=>setFst(e.target.value)}><option value="all">Todos</option><option value="ok">Cumplido</option><option value="warning">En Riesgo</option><option value="critical">Incumplido</option></select></div>
          <button className="btn b-gh" style={{alignSelf:'flex-end'}} onClick={()=>{setFq('');setFcat('all');setFst('all');}}>✕ Limpiar</button>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
          {[{v:'all',l:'Todos',cls:''},{v:'ok',l:`Cumplidos (${ok})`,cls:'p-ok'},{v:'warning',l:`En Riesgo (${warn})`,cls:'p-warn'},{v:'critical',l:`Incumplidos (${crit})`,cls:'p-crit'}].map(p=><button key={p.v} className={`pill ${p.cls}${fst===p.v?' on':''}`} onClick={()=>setFst(p.v)}>{p.l}</button>)}
        </div>
        <div className="sec">Servicios ({filt.length})</div>
        {curSvcs().length===0
          ?<div style={{background:G.sf,border:`1px solid ${G.ac}`,padding:'30px',textAlign:'center'}}><div style={{fontSize:'2.5rem',marginBottom:12,opacity:.4}}>📂</div><h2 style={{fontSize:'1rem',marginBottom:8}}>Sin servicios para <span style={{color:G.ac}}>{MONTHS[selMonth]} {selYear}</span></h2><button className="btn b-cy" style={{marginTop:12}} onClick={handleAdd}>+ Agregar Servicio</button></div>
          :filt.length===0?<div style={{textAlign:'center',padding:'44px',color:G.mu,fontFamily:'JetBrains Mono',fontSize:'.7rem'}}>Sin resultados para los filtros aplicados.</div>
          :<MonitorTable filt={filt} tab={tab} wd={curWD()} allData={allData} selYear={selYear} selMonth={selMonth} onEdit={handleEdit} onDelete={handleDelete} onSort={handleSort}/>}
        {showCharts&&filt.length>0&&<><div className="sec" style={{marginTop:24}}>Gráficas</div><ChartsSection filt={filt} tab={tab} allSvcs={curSvcs()}/></>}
      </>)}
      {page==='semaforo'&&<SemaforoPage svcs={curSvcs()} month={selMonth} year={selYear}/>}
      {page==='ejecutivo'&&<EjecutivoPage svcs={curSvcs()} month={selMonth} year={selYear} onPrint={()=>doPrint(curSvcs(),selMonth,selYear)}/>}
      {page==='comparativo'&&<ComparativosPage allData={allData}/>}
    </main>
    {modal?.type==='confirm'&&<ConfirmModal msg={modal.msg} onYes={modal.onYes} onNo={()=>setModal(null)}/>}
    {(modal?.type==='edit'||modal?.type==='add')&&<SvcModal svc={modal.svc||null} cats={cats} descs={descs} wd={curWD()} onSave={handleSave} onClose={()=>setModal(null)}/>}
    {modal?.type==='manage'&&<ManageModal cats={cats} descs={descs} onSave={(tc,td)=>{setCats(tc);setDescs(td);doSave(allData,weekDates,tc,td);showToast('✓ Listas actualizadas');setModal(null);}} onClose={()=>setModal(null)}/>}
    {modal?.type==='import'&&<ImportModal onClose={()=>setModal(null)} onImport={(rows,mode)=>{const key=curKey();const withId=rows.map(r=>({id:mkId(),...r}));const nd=mode==='replace'?{...allData,[key]:withId}:{...allData,[key]:(curSvcs().filter(s=>!withId.map(r=>r.name).includes(s.name))).concat(withId)};setAllData(nd);doSave(nd,weekDates,cats,descs);showToast(`✓ ${rows.length} importados`);setModal(null);}}/>}
    {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
  </div>);
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
